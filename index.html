<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zia — AI Voice Companion</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #eef0ff;
      --text-dim: #9a9ac0;
      --glow-primary: #a78bfa;
      --glow-secondary: #f0abfc;
      --danger: #ff7a7a;
      --radius: 28px;
      --transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 20% 20%, #1a1a3a 0%, #0a0a1a 55%, #04040a 100%);
      min-height: 100dvh;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.4s;
    }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      max-height: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 28px;
      backdrop-filter: blur(2px);
    }

    /* top bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
    }
    .ai-name {
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f5e9ff, #f0abfc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 400;
    }
    .settings-icon {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      padding: 8px 14px;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      color: var(--text);
      transition: var(--transition);
    }
    .settings-icon:hover {
      background: rgba(255,255,255,0.12);
    }

    /* main orb area */
    .orb-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
    }

    .orb-container {
      position: relative;
      width: 210px;
      height: 210px;
      margin-bottom: 25px;
    }

    .orb {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 160px;
      height: 160px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f0abfc, #a78bfa 65%, #4c3b8a);
      box-shadow: 0 0 70px rgba(167, 139, 250, 0.7), 0 0 120px rgba(240, 171, 252, 0.4);
      transition: all 0.5s ease;
      animation: floatIdle 4s ease-in-out infinite;
    }

    /* idle floating */
    @keyframes floatIdle {
      0%,100% { transform: translate(-50%, -50%) translateY(0px); }
      50% { transform: translate(-50%, -50%) translateY(-8px); }
    }

    /* listening state */
    .orb.listening {
      animation: listenPulse 1.6s ease-in-out infinite;
      box-shadow: 0 0 90px rgba(167, 139, 250, 0.9), 0 0 150px #f0abfc;
    }
    @keyframes listenPulse {
      0% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.3); }
      100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
    }

    /* thinking state */
    .orb.thinking {
      animation: thinkSpin 2s linear infinite;
      box-shadow: 0 0 70px rgba(167, 139, 250, 0.8);
    }
    @keyframes thinkSpin {
      0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.05); }
      100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
    }

    /* speaking state */
    .orb.speaking {
      animation: speakPulse 0.9s ease-in-out infinite;
      box-shadow: 0 0 110px #f0abfc, 0 0 180px #a78bfa;
    }
    @keyframes speakPulse {
      0%,100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1.2); }
      30% { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.5); }
      70% { transform: translate(-50%, -50%) scale(0.95); filter: brightness(1.1); }
    }

    .orb-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      animation: auraWave 5s infinite;
      pointer-events: none;
    }
    @keyframes auraWave {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.2; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    }

    .particle-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .status-text {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      margin-top: 8px;
      min-height: 24px;
      transition: opacity 0.2s;
    }

    /* bottom controls */
    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .mic-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .mic-btn:active {
      transform: scale(0.9);
      background: rgba(255,255,255,0.18);
    }
    .mic-btn svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .secondary-controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .secondary-btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: var(--transition);
    }
    .secondary-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* chat history overlay */
    .history-panel {
      position: fixed;
      bottom: 80px;
      left: 10px;
      right: 10px;
      background: rgba(10, 10, 25, 0.8);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 14px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--glass-border);
      display: none;
      z-index: 20;
      text-align: left;
    }
    .history-panel.active {
      display: block;
    }
    .msg-line {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
    }
    .msg-user { color: #c4b5fd; }
    .msg-ai { color: #f0abfc; }

    /* settings overlay */
    .settings-panel {
      position: fixed;
      top: 15%;
      left: 10%;
      right: 10%;
      background: rgba(15, 15, 30, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 24px;
      display: none;
      z-index: 30;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      flex-direction: column;
      gap: 16px;
    }
    .settings-panel.active {
      display: flex;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-row select, .setting-row input[type="range"] {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 6px 10px;
      border-radius: 20px;
    }
    .close-btn {
      align-self: flex-end;
      background: transparent;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* fallback text mode */
    .text-fallback {
      display: none;
      width: 100%;
      margin-top: 10px;
    }
    .text-fallback input {
      width: 80%;
      padding: 12px 18px;
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
    }
    .text-fallback button {
      padding: 10px 18px;
      border-radius: 40px;
      background: #a78bfa;
      border: none;
      color: white;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- top -->
    <div class="top-bar">
      <div>
        <span class="ai-name">Zia</span>
        <div class="subtitle">Your AI companion</div>
      </div>
      <div class="settings-icon" id="settingsToggle">⚙️</div>
    </div>

    <!-- orb area -->
    <div class="orb-wrapper">
      <div class="orb-container" id="orbContainer">
        <div class="orb-aura"></div>
        <div class="orb" id="orb"></div>
        <canvas class="particle-field" id="particleCanvas" width="220" height="220"></canvas>
      </div>
      <div class="status-text" id="statusText">Tap to talk</div>
    </div>

    <!-- history -->
    <div class="history-panel" id="historyPanel"></div>

    <!-- text fallback mode -->
    <div class="text-fallback" id="textFallback">
      <input type="text" id="textInput" placeholder="Type message..." />
      <button id="sendTextBtn">Send</button>
    </div>

    <!-- controls -->
    <div class="controls">
      <button class="mic-btn" id="micBtn" aria-label="Microphone">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
      </button>
      <div class="secondary-controls">
        <button class="secondary-btn" id="textModeBtn">⌨️ Text</button>
        <button class="secondary-btn" id="historyBtn">📜 History</button>
      </div>
    </div>
  </div>

  <!-- settings overlay -->
  <div class="settings-panel" id="settingsPanel">
    <button class="close-btn" id="closeSettings">×</button>
    <div class="setting-row">Voice speed <input type="range" id="voiceRate" min="0.6" max="1.3" step="0.05" value="0.95"></div>
    <div class="setting-row">Pitch <input type="range" id="voicePitch" min="0.8" max="1.3" step="0.05" value="1.1"></div>
    <div class="setting-row">Language <select id="languageSelect"><option value="en-IN">English (India)</option><option value="hi-IN">Hindi</option><option value="en-US">English US</option><option value="bn-IN">Bengali</option><option value="mr-IN">Marathi</option><option value="ta-IN">Tamil</option><option value="te-IN">Telugu</option><option value="gu-IN">Gujarati</option><option value="kn-IN">Kannada</option><option value="ml-IN">Malayalam</option><option value="pa-IN">Punjabi</option><option value="ur-IN">Urdu</option></select></div>
    <button class="secondary-btn" id="clearMemoryBtn">Clear Memory</button>
  </div>

  <script>
    (function() {
      // ----- core state -----
      let currentState = 'idle'; // idle | listening | thinking | speaking
      let recognition = null;
      let synth = window.speechSynthesis;
      let voices = [];
      let selectedVoice = null;
      let conversationHistory = []; // simple local memory
      let isMicActive = false;

      // DOM elements
      const orb = document.getElementById('orb');
      const statusText = document.getElementById('statusText');
      const micBtn = document.getElementById('micBtn');
      const historyPanel = document.getElementById('historyPanel');
      const settingsPanel = document.getElementById('settingsPanel');
      const settingsToggle = document.getElementById('settingsToggle');
      const closeSettings = document.getElementById('closeSettings');
      const textModeBtn = document.getElementById('textModeBtn');
      const textFallback = document.getElementById('textFallback');
      const textInput = document.getElementById('textInput');
      const sendTextBtn = document.getElementById('sendTextBtn');
      const historyBtn = document.getElementById('historyBtn');
      const voiceRate = document.getElementById('voiceRate');
      const voicePitch = document.getElementById('voicePitch');
      const languageSelect = document.getElementById('languageSelect');
      const clearMemoryBtn = document.getElementById('clearMemoryBtn');

      // initialize voices
      function loadVoices() {
        if (!synth) return;
        voices = synth.getVoices();
        if (voices.length > 0) {
          selectBestVoice();
        }
      }
      if (synth) {
        loadVoices();
        synth.onvoiceschanged = loadVoices;
      }

      function selectBestVoice() {
        const lang = languageSelect.value;
        const priorities = [
          { lang: 'en-IN', female: true }, { lang: 'hi-IN', female: true }, 
          { lang: 'en-US', female: true }, { lang: 'en-GB', female: true }
        ];
        for (let p of priorities) {
          const match = voices.find(v => v.lang === p.lang && (p.female ? /female|woman|samantha|google हिन्दी|google india/i.test(v.name) : true));
          if (match) { selectedVoice = match; return; }
        }
        selectedVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
      }

      // status update
      function setState(state, customStatus = null) {
        currentState = state;
        orb.classList.remove('listening', 'thinking', 'speaking');
        if (state === 'listening') {
          orb.classList.add('listening');
          statusText.textContent = 'Listening...';
        } else if (state === 'thinking') {
          orb.classList.add('thinking');
          statusText.textContent = 'Thinking...';
        } else if (state === 'speaking') {
          orb.classList.add('speaking');
          statusText.textContent = 'Speaking...';
        } else {
          statusText.textContent = customStatus || 'Tap to talk';
        }
      }

      // speech recognition setup
      function initRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          console.warn('Speech recognition not supported');
          return null;
        }
        const rec = new SpeechRecognition();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = languageSelect.value || 'en-IN';
        rec.onresult = (event) => {
          let interim = '';
          let final = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              final += event.results[i][0].transcript;
            } else {
              interim += event.results[i][0].transcript;
            }
          }
          if (final) {
            processUserSpeech(final);
          }
        };
        rec.onerror = (e) => {
          if (e.error === 'not-allowed') {
            statusText.textContent = 'Mic permission denied';
          } else {
            statusText.textContent = 'Something went wrong. Try again.';
          }
          setState('idle');
        };
        rec.onend = () => {
          if (currentState === 'listening') setState('idle');
        };
        return rec;
      }

      // text-to-speech
      function speakText(text) {
        if (!synth || !text) return;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.rate = parseFloat(voiceRate.value);
        utterance.pitch = parseFloat(voicePitch.value);
        utterance.volume = 1;
        utterance.onstart = () => setState('speaking');
        utterance.onend = () => setState('idle');
        utterance.onerror = () => setState('idle');
        synth.speak(utterance);
      }

      // AI response (mock, deterministic, warm)
      function getAIResponse(userText) {
        const lower = userText.toLowerCase();
        if (lower.includes('crush') || lower.includes('ladki') || lower.includes('pasand')) {
          return "Ohh... okay. Tell me more about her. Tumhe usme sabse achha kya lagta hai?";
        } else if (lower.includes('sad') || lower.includes('udaas') || lower.includes('dukhi')) {
          return "Hmm... samajh sakti hoon. Tumhare mind mein kaafi kuch chal raha hai na? Main sun rahi hoon.";
        } else if (lower.includes('nervous') || lower.includes('himmat')) {
          return "Kabhi-kabhi jis person ki opinion important hoti hai, uske saamne feelings bolna surprisingly difficult ho jata hai. Tum kya kehna chahte the?";
        } else if (lower.includes('hello') || lower.includes('hi')) {
          return "Hey! Main yahin hoon. Bolo, kya chal raha hai?";
        } else if (lower.includes('real girlfriend') || lower.includes('meri girlfriend')) {
          return "Main tumhari real-life girlfriend nahi hoon, main tumhari AI companion hoon. Lekin tum mujhse honestly baat kar sakte ho.";
        } else {
          return "Hmm, bolo... main sun rahi hoon. Tumhe kaisa lag raha hai?";
        }
      }

      // process user speech
      function processUserSpeech(text) {
        const userMsg = text.trim();
        if (!userMsg) return;
        addToHistory('user', userMsg);
        setState('thinking');
        // simulate thinking delay
        setTimeout(() => {
          const reply = getAIResponse(userMsg);
          addToHistory('ai', reply);
          speakText(reply);
        }, 600);
      }

      function addToHistory(sender, message) {
        conversationHistory.push({ sender, message });
        if (historyPanel.classList.contains('active')) renderHistory();
      }

      function renderHistory() {
        historyPanel.innerHTML = '';
        conversationHistory.slice(-20).forEach(msg => {
          const div = document.createElement('div');
          div.className = `msg-line ${msg.sender === 'user' ? 'msg-user' : 'msg-ai'}`;
          div.textContent = (msg.sender === 'user' ? 'You: ' : 'Zia: ') + msg.message;
          historyPanel.appendChild(div);
        });
        historyPanel.scrollTop = historyPanel.scrollHeight;
      }

      // mic button handler
      micBtn.addEventListener('click', () => {
        if (currentState === 'speaking') {
          synth.cancel();
          setState('idle');
          return;
        }
        if (!recognition) {
          recognition = initRecognition();
          if (!recognition) {
            statusText.textContent = 'Voice not supported. Use text mode.';
            return;
          }
        }
        if (currentState === 'listening') {
          recognition.stop();
          setState('idle');
          return;
        }
        recognition.lang = languageSelect.value;
        setState('listening');
        try {
          recognition.start();
        } catch (e) {
          setState('idle');
        }
      });

      // settings
      settingsToggle.addEventListener('click', () => {
        settingsPanel.classList.toggle('active');
      });
      closeSettings.addEventListener('click', () => settingsPanel.classList.remove('active'));
      languageSelect.addEventListener('change', () => {
        if (recognition) recognition.lang = languageSelect.value;
        selectBestVoice();
      });
      clearMemoryBtn.addEventListener('click', () => {
        conversationHistory = [];
        renderHistory();
      });

      // text mode
      textModeBtn.addEventListener('click', () => {
        textFallback.style.display = textFallback.style.display === 'block' ? 'none' : 'block';
      });
      sendTextBtn.addEventListener('click', () => {
        const val = textInput.value.trim();
        if (!val) return;
        textInput.value = '';
        processUserSpeech(val);
      });
      textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendTextBtn.click();
        }
      });

      historyBtn.addEventListener('click', () => {
        historyPanel.classList.toggle('active');
        if (historyPanel.classList.contains('active')) renderHistory();
      });

      // particle animation (simple)
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      function initParticles() {
        particles = [];
        for (let i=0; i<30; i++) {
          particles.push({ x: Math.random()*220, y: Math.random()*220, r: Math.random()*2+1, speed: Math.random()*0.5+0.2, angle: Math.random()*Math.PI*2 });
        }
      }
      initParticles();
      function drawParticles() {
        ctx.clearRect(0,0,220,220);
        particles.forEach(p => {
          p.x += Math.cos(p.angle)*p.speed;
          p.y += Math.sin(p.angle)*p.speed;
          if (p.x<0||p.x>220||p.y<0||p.y>220) { p.x=Math.random()*220; p.y=Math.random()*220; }
          ctx.beginPath();
          ctx.fillStyle = 'rgba(240,171,252,0.6)';
          ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
          ctx.fill();
        });
        requestAnimationFrame(drawParticles);
      }
      drawParticles();

      // cleanup on page hide
      window.addEventListener('beforeunload', () => {
        if (synth) synth.cancel();
        if (recognition) recognition.abort();
      });

      // initial browser support detection
      if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
        statusText.textContent = 'Voice recognition not supported. Try Chrome.';
      }
      if (!window.speechSynthesis) {
        statusText.textContent = 'TTS not supported. Text mode available.';
      }

      // first time greeting (only after first interaction)
      let firstInteraction = true;
      document.addEventListener('click', function firstClick() {
        if (firstInteraction) {
          firstInteraction = false;
          setTimeout(() => {
            speakText("Hi, I'm Zia. Tap the orb and let's talk.");
          }, 300);
        }
        document.removeEventListener('click', firstClick);
      });

      // set default language
      if (recognition) recognition.lang = 'en-IN';
    })();
  </script>
</body>
</html>
