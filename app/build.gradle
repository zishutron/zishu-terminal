plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zishu.terminal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zishu.terminal'
        minSdk 21
        targetSdk 28
        versionCode 600
        versionName '6.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
