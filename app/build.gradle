plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zishu.terminal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zishu.terminal'
        minSdk 21
        targetSdk 28
        versionCode 600
        versionName '6.0.0'
    }

    // Fixed DEBUG key (public on purpose, debug builds only) so every CI build is signed
    // the same way and can be installed over the previous one without losing app data.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
