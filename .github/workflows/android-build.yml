name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PACKAGE: com.zishu.terminal
  EXPECTED_VERSION_NAME: "6.0.0"
  EXPECTED_VERSION_CODE: "600"

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate project structure
        run: |
          fail=0
          for f in gradlew settings.gradle app/build.gradle app/src/main/AndroidManifest.xml; do
            if [ -f "$f" ]; then echo "ok:      $f"; else echo "::error::missing file: $f"; fail=1; fi
          done
          if [ -d app/src/main/java/com/zishu/terminal ]; then echo "ok:      java sources"; else echo "::error::missing app/src/main/java/com/zishu/terminal"; fail=1; fi
          echo "--- repo layout ---"; git ls-files | head -30
          if git ls-files | grep -Ei '\.(pkcs12|p12|jks|keystore)$'; then
            echo "::warning::A keystore file is tracked in git (listed above). Remove it from the repo and history, and use GitHub Secrets."
          fi
          if grep -rniE 'beta|early-access' app/src/main/res app/src/main/java app/src/main/AndroidManifest.xml; then
            echo "::error::Beta branding found (listed above)"; fail=1
          fi
          exit $fail

      - name: Unit tests
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Verify APK metadata
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          test -f "$APK"
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          BADGING=$($AAPT2 dump badging "$APK")
          echo "$BADGING" | head -3
          echo "$BADGING" | grep -q "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" \
            || { echo "::error::APK metadata mismatch"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/Zishu-Terminal-v${EXPECTED_VERSION_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Zishu-Terminal-v6.0.0-debug
          path: dist/Zishu-Terminal-v6.0.0-debug.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
