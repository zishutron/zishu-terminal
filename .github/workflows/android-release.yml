name: Android Release

# Produces an UNSIGNED APK as a build artifact only. Download it, sign it yourself
# (apksigner) and upload the signed APK to the GitHub Release manually.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_PACKAGE: com.zishu.terminal
  EXPECTED_VERSION_NAME: "6.0.0"
  EXPECTED_VERSION_CODE: "600"

jobs:
  release:
    name: Unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Verify metadata
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/aapt2 dump badging "$APK" | grep -q "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" \
            || { echo "::error::APK metadata mismatch"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/Zishu-Terminal-v${EXPECTED_VERSION_NAME}-unsigned.apk"
          (cd dist && sha256sum "Zishu-Terminal-v${EXPECTED_VERSION_NAME}-unsigned.apk" > "Zishu-Terminal-v${EXPECTED_VERSION_NAME}-unsigned.apk.sha256")
          cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Zishu-Terminal-v6.0.0-unsigned
          path: dist/*
          if-no-files-found: error
