name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach assets to the GitHub Release

env:
  EXPECTED_PACKAGE: com.zishu.terminal
  EXPECTED_VERSION_NAME: "6.0.0"
  EXPECTED_VERSION_CODE: "600"

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [ "${GITHUB_REF_NAME}" = "v${EXPECTED_VERSION_NAME}" ] \
            || { echo "::error::Tag ${GITHUB_REF_NAME} != v${EXPECTED_VERSION_NAME}"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (protected job only)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Verify signature and metadata
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/apksigner verify --verbose --print-certs "$APK" | grep -v -i "SHA-1\|SHA-256 digest of public" | head -8
          $BT/aapt2 dump badging "$APK" | grep -q "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" \
            || { echo "::error::APK metadata mismatch"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/Zishu-Terminal-v${EXPECTED_VERSION_NAME}.apk"
          (cd dist && sha256sum "Zishu-Terminal-v${EXPECTED_VERSION_NAME}.apk" > "Zishu-Terminal-v${EXPECTED_VERSION_NAME}.apk.sha256")
          cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Zishu-Terminal-v6.0.0-release
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/RELEASE_NOTES.md

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
